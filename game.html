<!DOCTYPE html>
<html>
<head>
    <title>Eevee Clicker!</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            padding: 40px;
        }
        h1 { color: #ffb8b8; margin-bottom: 5px; }
        .score-box {
            font-size: 24px;
            margin: 10px 0;
            font-weight: bold;
            color: #ffd2b8;
        }
        .click-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s ease;
            margin: 20px 0;
        }
        .click-btn:active { transform: scale(0.85); }
        .status-msg {
            font-style: italic;
            color: #ff7675;
            height: 20px;
            font-weight: bold;
        }
        /* SHOP STYLING */
        .shop-container {
            background: #161623;
            border: 2px dashed #ff7675;
            border-radius: 10px;
            padding: 20px;
            max-width: 400px;
            margin: 25px auto;
        }
        .shop-btn {
            background: #ff7675;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        .shop-btn:hover { background: #fd79a8; }
        .nav-link { display: inline-block; margin-top: 20px; color: #aaa; text-decoration: none; }
    </style>
</head>
<body>

    <h1>🤎 Eevee Clicker Game </h1>
    <p>Click Eevee to give him treats and buy cool upgrades!</p>

    <div class="score-box">
        🍪 Treats: <span id="counter">0</span>
    </div>
    
    <div style="font-size: 18px; color: #a29bfe; margin-bottom: 10px;">
        ⚡ Click Power: +<span id="clickPower">1</span> | 🤖 Auto-Clickers: <span id="autoCount">0</span>
    </div>

    <button class="click-btn" onclick="giveTreat()">
        <!-- Kept your working Eevee GIF link -->
        <img src="https://projectpokemon.org/home/gallery/image/74563-eevee-gifgif/?do=download" width="220" alt="Eevee"/>
    </button>

    <div id="status" class="status-msg">Eevee looks hungry...</div>

    <!-- THE UPGRADE SHOP -->
    <div class="shop-container">
        <h3>🛒 Treat Shop</h3>
        <div>
            <button class="shop-btn" onclick="buyDouble()">🔥 Double Clicks (Cost: 15)</button>
            <p style="font-size: 12px; color: #aaa; margin: 0 0 10px 0;">Each click gives 2 treats instead of 1</p>
        </div>
        <div>
            <button class="shop-btn" onclick="buyAuto()">🤖 Auto-Feeder (Cost: 30)</button>
            <p style="font-size: 12px; color: #aaa; margin: 0;">Automatically gives 1 treat every second</p>
        </div>
    </div>

    <a href="index.html" class="nav-link">← Back to my Shrine</a>

    <script>
        let count = 0;
        let power = 1;
        let autos = 0;

        function updateDisplay() {
            document.getElementById("counter").innerText = count;
            document.getElementById("clickPower").innerText = power;
            document.getElementById("autoCount").innerText = autos;
        }

        // Manual click action
        function giveTreat() {
            count += power;
            updateDisplay();
        }

        // Upgrade 1: Double Clicks
        function buyDouble() {
            if (count >= 15) {
                count -= 15;
                power += 1;
                document.getElementById("status").innerText = "💥 Click power upgraded!";
                updateDisplay();
            } else {
                document.getElementById("status").innerText = "❌ Not enough treats!";
            }
        }

        // Upgrade 2: Auto Clicker
        function buyAuto() {
            if (count >= 30) {
                count -= 30;
                autos += 1;
                document.getElementById("status").innerText = "🤖 Auto-feeder activated!";
                updateDisplay();
            } else {
                document.getElementById("status").innerText = "❌ Not enough treats!";
            }
        }

        // Background loop that runs the Auto-Clickers every 1 second
        setInterval(function() {
            if (autos > 0) {
                count += autos;
                updateDisplay();
            }
        }, 1000);
    </script>

</body>
</html>
