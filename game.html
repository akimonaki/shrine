<!DOCTYPE html>
<html>
<head>
    <title>Eevee Clicker!</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
        }
        h1 { color: #ffb8b8; }
        .score-box {
            font-size: 24px;
            margin: 20px 0;
            font-weight: bold;
            color: #ffd2b8;
        }
        .click-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s ease;
        }
        .click-btn:active {
            transform: scale(0.9);
        }
        .status-msg {
            font-style: italic;
            color: #aaa;
            margin-top: 15px;
            height: 20px;
        }
        .nav-link {
            display: inline-block;
            margin-top: 40px;
            color: #ff7675;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>🤎 Eevee Clicker Game 🤎</h1>
    <p>Click Eevee to give him treats and level him up!</p>

    <div class="score-box">
        🍪 Treats Given: <span id="counter">0</span>
    </div>
    
    <div class="score-box" style="font-size: 18px; color: #a29bfe;">
        ✨ Eevee Level: <span id="level">1</span>
    </div>

    <!-- The button is just Eevee himself! -->
    <button class="click-btn" onclick="giveTreat()">
        <img src="https://projectpokemon.org/home/gallery/image/74563-eevee-gifgif/?do=download" width="250" alt="Eevee"/>
    </button>

    <div id="status" class="status-msg">Eevee looks hungry...</div>

    <br>
    <a href="index.html" class="nav-link">← Back to my Shrine</a>

    <script>
        let count = 0;
        let currentLevel = 1;

        function giveTreat() {
            // 1. Add 1 to the treat counter
            count++;
            document.getElementById("counter").innerText = count;

            // 2. Level up logic!
            if (count === 10) {
                currentLevel = 2;
                document.getElementById("level").innerText = currentLevel;
                document.getElementById("status").innerText = "Eevee is happy! (Level 2)";
            } else if (count === 25) {
                currentLevel = 3;
                document.getElementById("level").innerText = currentLevel;
                document.getElementById("status").innerText = "Eevee loves you! (Level 3)";
            } else if (count === 50) {
                currentLevel = "MAX";
                document.getElementById("level").innerText = currentLevel;
                document.getElementById("status").innerText = "Eevee is completely stuffed! 🎉";
            }
        }
    </script>

</body>
</html>
